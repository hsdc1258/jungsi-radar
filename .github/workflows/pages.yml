name: GitHub Pages 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 데이터 생성물이 소스와 맞는지 확인
        run: |
          npm run build
          git diff --exit-code assets/data.js
      - name: 테스트
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Pages가 꺼져 있을 때 안내
        if: failure() && steps.pages.outcome == 'failure'
        run: |
          echo "::error::저장소 Settings → Pages → Source 를 'GitHub Actions' 로 한 번 켜 주세요."
          echo "워크플로 토큰에는 Pages 사이트를 새로 만들 권한이 없습니다."
          exit 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
